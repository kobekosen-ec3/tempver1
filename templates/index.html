<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>温度モニター</title>
    <link rel="stylesheet" href="temp.css">
</head>
<body>
  <div class="Top">
    <h1>温度モニター</h1>
      <div class="set">
        <label>ブザー温度(℃)：</label>
        <input type="number" id="threshold" value="30" step="0.1">
        <button id="saveThreshold">✓</button>
      </div>
      </div>

      <div class="flexbox">
      <div class="nowbox">
        <div class="nowtx1">時刻：<span id="time">--:--:--</span></div>
        <div class="nowtx">センサ温度：<span id="ds">-- ℃</span></div>
        <div class="nowtx">本体温度　：<span id="pico">-- ℃</span></div>
      </div>

      <div class="logbox">
        <h2>ログ</h2>
        <div class="log" id="logbox">
          <!-- <ul id="log">aaaaa</ul>
          <ul id="log">aaaaa</ul>
          <ul id="log">aaaaa</ul>
          <ul id="log">aaaaa</ul> -->
        </div>
      </div>
    </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
    <script src="temp.js"></script>
        
</body>
</html>
