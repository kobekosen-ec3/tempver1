<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>温度モニター</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <div class="Top">
    <h1>温度モニター</h1>
      <div class="set">
        <label>ブザー温度(℃)：</label>
        <input type="number" id="threshold" step="0.1">
        <button class="setbtn" id="savetempbtn" >✓</button>
      </div>
      <button id="postset" class="postset">⚙</button>
      <div id="send" class="hidden">
          <button onclick="location.href='/discord'" class="sendapp">ディスコード</button>
      </div>
    </div>

    <div class="flexbox">
      <div class="nowbox">
        <div class="nowtx1">時刻：<span id="time">--:--:--</span></div>
        <div class="nowtx">センサ温度：<span id="ds">--.-- ℃</span></div>
        <div class="nowtx">本体温度　：<span id="pico">--.--℃</span></div>
      </div>

      <div class="logbox">
        <div class="flexbox2">
          <h2>ログ</h2>
          <button id="toTop" class="up">↑</button>
        </div>
        <div class="log" id="logs">
            <div id="loading" class="loading">
                <div class="spinner"></div>
            </div>
            <ul id="log"></ul>
      　　</div>
      </div>
    </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
    <script src="/static/script.js"></script>
        
</body>
</html>
